<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 0;
    color: #222;
}

header {
    background: #142b50;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 10px;
}

.container {
    max-width: 950px;
    margin: 20px auto;
    padding: 15px;
}

.toolbar {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.question {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px #00000010;
}

.question h3 {
    margin-top: 0;
    line-height: 1.5;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.option {
    background: #f8fafc;
    border: 1px solid #ccd5e0;
    border-radius: 8px;
    padding: 12px;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    color: #222;
}

.option:hover:not(:disabled) {
    background: #e7efff;
}

.option.correct {
    background: #c9f7d5;
    border: 2px solid #16803d;
}

.option.wrong {
    background: #ffdada;
    border: 2px solid #d32f2f;
}

.option:disabled {
    cursor: default;
    opacity: 1;
}

.explanation {
    display: none;
    background: #eef4ff;
    padding: 12px;
    border-left: 4px solid #2457c5;
    margin-top: 12px;
    border-radius: 5px;
    line-height: 1.6;
}

.explanation.show {
    display: block;
}

button.action {
    background: #2457c5;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 15px;
}

button.reset {
    background: #475569;
}

#result {
    display: none;
    background: white;
    text-align: center;
    padding: 25px;
    border: 2px solid #2457c5;
    border-radius: 12px;
    margin-top: 25px;
}

#score {
    font-size: 35px;
    font-weight: bold;
    color: #2457c5;
}

@media(max-width:600px) {
    .options {
        grid-template-columns: 1fr;
    }

    .question {
        padding: 15px;
    }
}
</style>
</head>

const answers = {};
const quiz = document.getElementById("quiz");

function renderQuestions() {
    quiz.innerHTML = "";

    questions.forEach((q) => {
        const card = document.createElement("div");
        card.className = "question";
        card.id = "question-" + q.n;

        let html = `<h3>Question ${q.n}: ${q.q}</h3>`;
        html += `<div class="options">`;

        q.o.forEach((option, i) => {
            html += `
                <button class="option"
                    data-index="${i}"
                    onclick="selectAnswer(${q.n}, ${i})">
                    ${String.fromCharCode(65 + i)}. ${option}
                </button>
            `;
        });

        html += `</div>`;
        html += `<div class="explanation" id="explanation-${q.n}"></div>`;

        card.innerHTML = html;
        quiz.appendChild(card);
    });

    updateProgress();
}

function selectAnswer(questionNumber, selectedIndex) {
    if (answers[questionNumber] !== undefined) {
        return;
    }

    const q = questions.find(item => item.n === questionNumber);
    answers[questionNumber] = selectedIndex;

    const card = document.getElementById("question-" + questionNumber);
    const buttons = card.querySelectorAll(".option");

    buttons.forEach((button, index) => {
        button.disabled = true;

        if (index === q.a) {
            button.classList.add("correct");
        }

        if (index === selectedIndex && selectedIndex !== q.a) {
            button.classList.add("wrong");
        }
    });

    const explanation = document.getElementById(
        "explanation-" + questionNumber
    );

    explanation.innerHTML = `
        <strong>
            ${selectedIndex === q.a ? "Correct answer!" : "Wrong answer!"}
        </strong>
        <br>
        <strong>Correct option:</strong>
        ${String.fromCharCode(65 + q.a)}. ${q.o[q.a]}
        <br>
        <strong>Explanation:</strong> ${q.e}
    `;

    explanation.classList.add("show");

    updateProgress();
}

function updateProgress() {
    document.getElementById("progress").textContent =
        `Answered: ${Object.keys(answers).length} / ${questions.length}`;
}

function showResult() {
    let correct = 0;
    let wrong = 0;
    let unanswered = 0;

    questions.forEach(q => {
        if (answers[q.n] === undefined) {
            unanswered++;
        } else if (answers[q.n] === q.a) {
            correct++;
        } else {
            wrong++;
        }
    });

    // Scoring: +1 for correct, -0.20 for wrong, 0 for unanswered.
    const marks = correct - (wrong * 0.20);

    document.getElementById("result").style.display = "block";
    document.getElementById("score").textContent =
        `${marks.toFixed(2)} / ${questions.length}`;

    document.getElementById("details").innerHTML = `
        Correct answers: ${correct}<br>
        Wrong answers: ${wrong}<br>
        Unanswered: ${unanswered}<br>
        Negative marks: ${(wrong * 0.20).toFixed(2)}<br>
        <strong>Final marks: ${marks.toFixed(2)}</strong>
    `;

    document.getElementById("result").scrollIntoView({
        behavior: "smooth"
    });
}

function reviewAnswers() {
    document.querySelectorAll(".explanation").forEach(element => {
        element.classList.add("show");
    });

    document.getElementById("quiz").scrollIntoView({
        behavior: "smooth"
    });
}

function resetTest() {
    for (const key in answers) {
        delete answers[key];
    }

    document.getElementById("result").style.display = "none";

    renderQuestions();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

renderQuestions();
</script>
